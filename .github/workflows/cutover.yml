# Manual only. A push does not move gifos.app.
name: Cut over

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect, apply, or rollback
        required: true
        type: choice
        options:
          - inspect
          - apply
          - rollback

permissions:
  contents: read

concurrency:
  group: cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: python3 -u .github/scripts/cutover.py
