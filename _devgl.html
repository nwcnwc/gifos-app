<!doctype html><meta charset="utf-8"><title>dev gl control</title>
<body style="margin:0;background:#000">
<!--
  Dev-only CONTROL, and the only question it answers: can `adb screenrecord`
  capture a WebGL canvas on this phone at all?

  Every capture of the game shows a live HUD over a BLACK viewport. That is two
  completely different stories — a scene that is not drawing, or a capture path
  that cannot see a GPU surface — and the frame numbers mean opposite things in
  each. `adb exec-out screencap` is already known to return blank here, which is
  exactly why screenrecord is used; nothing has ever confirmed screenrecord
  fares better. So: a canvas cleared to a colour no UI on this device uses, next
  to a DOM div of the same colour. Capture it and look.

    both red   → screenrecord sees WebGL, and the game's black viewport is REAL
    div red, canvas black → the capture path is the liar, not the game
-->
<canvas id="c" width="320" height="320" style="width:50vw;height:50vw;display:block"></canvas>
<div style="width:50vw;height:20vw;background:#ff2d2d"></div>
<div id="say" style="color:#eee;font:16px system-ui;padding:.5rem"></div>
<script>
var c = document.getElementById('c');
var gl = c.getContext('webgl2') || c.getContext('webgl');
var say = document.getElementById('say');
if (!gl) { say.textContent = 'NO WEBGL'; }
else {
  // Keep drawing every frame: a single clear can be lost to a compositor that
  // only samples the surface once, which would fake the very failure we are
  // trying to tell apart.
  (function draw() {
    gl.clearColor(1, 0.176, 0.176, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    requestAnimationFrame(draw);
  })();
  say.textContent = 'WEBGL OK — ' + (gl.getParameter(gl.VERSION) || '');
}
</script>
