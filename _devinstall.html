<!doctype html><meta charset="utf-8"><title>dev install</title>
<body style="font:14px system-ui;background:#111;color:#eee;padding:1rem">
<pre id="o">installing…</pre>
<script src="js/gifos-gif.js"></script>
<script src="js/gifos-ed.js"></script>
<script src="js/gifos-sign.js"></script>
<script src="js/gifos-zip.js"></script>
<script src="js/gifos-icons.js"></script>
<script src="js/gifos-themes.js"></script>
<script src="js/gifos-store.js"></script>
<script>
// Dev-only: put the built app into this device's GifOS store and open it.
// Exists because the phone cannot be driven by a debugger (CDP is a wall on
// it), so the app has to be installed by the page itself.
(async function () {
  const out = document.getElementById('o');
  const log = (m) => { out.textContent += '\n' + m; console.info('[devinstall] ' + m); };
  try {
    const r = await fetch('apps/fps-simple/fps-simple.gif?ts=' + Date.now(), { cache: 'no-store' });
    const bytes = new Uint8Array(await r.arrayBuffer());
    log('gif ' + (bytes.length / 1024 | 0) + ' KB');
    // REUSE an existing install unless ?fresh=1. The app's database is keyed by
    // FILE ID, so reinstalling hands it a brand-new empty store — which means a
    // reinstall can never measure a second load, because nothing it cached last
    // time is addressable any more. That is a harness bug that would have made
    // every repeat-load number look like a first load.
    const fresh = /[?&]fresh=1/.test(location.search);
    const existing = (await GifOS.store.allFiles()).filter((f) => f.appId === 'fps-simple');
    if (fresh) {
      for (const f of existing) { try { await GifOS.store.deleteFile(f.id); } catch (e) {} }
      log('removed ' + existing.length + ' previous copies');
    } else if (existing.length) {
      log('reusing install ' + existing[0].id);
      location.href = 'run.html#id=' + existing[0].id;
      return;
    }
    const fid = GifOS.store.uid('file');
    await GifOS.store.putFile({ id: fid, name: 'FPS Simple.gif', bytes, kind: 'gif',
      isApp: true, appId: 'fps-simple', mime: 'image/gif' });
    await GifOS.store.putItem({ id: GifOS.store.uid('item'), kind: 'file', fileId: fid,
      name: 'FPS Simple.gif', parent: null, x: 60, y: 60, iconSize: 64 });
    log('installed ' + fid);
    location.href = 'run.html#id=' + fid;
  } catch (e) { log('FAILED ' + (e && e.message || e)); }
})();
</script>
