<!DOCTYPE html>

<!-- FRAME GUARD. GitHub Pages sends no X-Frame-Options and a <meta> cannot
     carry frame-ancestors, so this is the only thing that keeps a third-party
     page from framing GifOS at opacity 0 and steering a click onto Allow,
     Install or Approve. Same-origin framing (booted images, app mounts) is
     allowed; anything else sees a link to open the page itself. Parser-
     blocking and ES5 on purpose: it runs before any chrome paints. -->
<script id="gifos-frame-guard">(function(){try{if(window.top===window.self)return;var ok=false;try{ok=window.top.location.origin===window.location.origin}catch(e){}if(ok)return;var h=document.documentElement;h.style.visibility='hidden';function show(){var b=document.body;if(!b)return;while(b.firstChild)b.removeChild(b.firstChild);var p=document.createElement('p');p.style.cssText='font:16px system-ui,sans-serif;padding:24px;color:#eee;background:#111;margin:0';p.appendChild(document.createTextNode('GifOS does not run inside another site\'s page. '));var a=document.createElement('a');a.href=location.href;a.target='_blank';a.rel='noopener';a.textContent='Open it in its own tab';a.style.color='#9db4ff';p.appendChild(a);b.appendChild(p);h.style.visibility='';}if(document.body)show();else document.addEventListener('DOMContentLoaded',show);}catch(e){}})();</script>

<!-- CHANNEL LOADER — see index.html. Resolves the release pointer before any app
     code so a meeting link opens on the right build. Identical across entry pages. -->
<script>
(function () {
  // THE CHANNEL DECISION, exposed as a callable so it can be tested directly
  // (test/browser/e2e.js). Returns null to stay on this build, {redirect:<url>}
  // to move, or {clear:true} when ?stable/?unpin/?latest just cleared a pin and
  // there is nowhere to go. The three lines at the bottom are the ONLY caller in
  // the page, so a test of this function is a test of what actually ships —
  // when this hook was dropped during a loader redesign, e2e.js's five pinning
  // assertions died as a TypeError and version pinning silently lost its guard.
  function pinTarget(pathname, search, hash) {
    pathname = pathname || '/'; search = search || ''; hash = hash || '';
    if (pathname.indexOf('/versions/') !== -1) return null;   // immutable build — never redirect
    var q; try { q = new URLSearchParams(search); } catch (e) { q = null; }
    // Flags may arrive IN THE HASH: the 404 pretty-URL router folds the query
    // into the hash it builds (/meet/<room>?edge -> /run.html#room=<room>&edge),
    // so a channel flag must be honored from either place.
    function has(k) { return !!(q && q.has(k)) || new RegExp('[#&]' + k + '(&|=|$)').test(hash); }
    // A LINK NEVER ATTACHES ANYONE. Everybody runs the latest release; the edge
    // build and older releases are for testers, chosen only in Settings →
    // Updates → Advanced / testing, behind a confirm. So ?edge stores nothing
    // here: it rides along in the address, and the Home Screen may at most open
    // that confirm. ?stable / ?unpin / ?latest still go back to latest.
    var cleared = false;
    try {
      if (has('stable') || has('unpin') || has('latest')) { localStorage.removeItem('gifos_channel'); localStorage.removeItem('gifos_pin'); localStorage.removeItem('gifos_pin_until'); cleared = true; }
    } catch (e) {}
    var pin = null, chan = null, cur = null, until = null;
    try { pin = localStorage.getItem('gifos_pin'); chan = localStorage.getItem('gifos_channel'); cur = localStorage.getItem('gifos_current'); until = localStorage.getItem('gifos_pin_until'); } catch (e) {}
    // gifos_pin_until is only the confirm's receipt. Any stored value means
    // this computer chose the pin on purpose, and the pin stays. The value
    // is never an end. A choice with no record predates the confirm (a stray
    // ?edge link could have made it), so on gifos.app it is reset once
    // (RESET_UNCONFIRMED). The Home Screen says so once.
    var RESET_UNCONFIRMED = true;
    if ((pin || chan === 'edge') && until === null && RESET_UNCONFIRMED && /(^|\.)gifos\.app$/.test(location.hostname)) {
      try { localStorage.setItem('gifos_pin_ended', 'reset:' + (pin || 'edge')); localStorage.removeItem('gifos_pin'); localStorage.removeItem('gifos_channel'); localStorage.removeItem('gifos_pin_until'); } catch (e) {}
      pin = null; chan = null;
    }
    var stay = cleared ? { clear: true } : null;
    // A ROOM address (/meet#room=…, or an old /meet/<room>, /join/<code>[/…]) is NOT a
    // file — Pages 404s it and 404.html routes it to a real page. If we ever run at
    // one (an offline cached shell, or any substitution of index.html), prepending
    // /versions/<v> would build /versions/<v>/meet/<room>, which exists nowhere, and
    // bounce the visitor to the desktop with their invite silently dropped. So
    // translate a pretty path to its real target instead of decorating it. Room case
    // is PRESERVED: the room id is the capability the key derives from.
    //
    // FLAG DAY 2026-08-05 (prelaunch, NO SHIMS): snapshots are addressed as
    // run.html, PERIOD. The runtime was renamed meet.html -> run.html on
    // 2026-08-04 and the compat shim is DELETED — snapshots cut before 0.9.3
    // ship their runtime as meet.html and are therefore NO LONGER
    // loader-addressable (deliberate: prelaunch, nobody real is pinned, and a
    // per-version filename table is exactly the compat rot we refuse to
    // carry). Old meet.html#... links are dead the same way.

    // The room address -> the meeting page's fragment: the ONE link module (js/core/link.js, loaded just above).
    var pm = window.GifOSLink ? window.GifOSLink.route(pathname, search, hash) : null;
    var here;
    if (pm) {
      // the page is the view: a /meet link the meeting page, a /cast link the broadcast page, a /join link run.html
      var pk = window.GifOSLink.read(pathname, search, hash).route;
      here = (pk === 'cast' ? '/cast' : pk === 'meet' ? '/meet' : '/run.html') + '#' + pm;
    } else {
      // Carry the page + invite hash across (snapshots ship run.html too —
      // flag day above) AND THE QUERY. The query used to be dropped here,
      // which silently broke the one link built for strangers:
      // gifos.app/?run=<gif url> ("open this app"). A first visit is exactly
      // when the release redirect fires, so the visitor most likely to follow
      // a shared run-link was the one guaranteed to lose it — they landed on
      // a bare Home Screen with nothing said. It must be the QUERY and not
      // the hash (the usual doctrine) for one decisive reason: released
      // snapshots are immutable, and 0.9.5's desktop.js reads ?run= from
      // location.search. Carrying the hash instead would fix nothing until
      // the NEXT release, for links sent today.
      here = pathname + search + hash;
      // THE SURFACE PAGES (meet.html, cast.html; the host serves them at /meet and /cast, and /versions/<v>/meet|cast) keep
      // their own name: the page is the view (a room link never falls back below LINK_SINCE, and every release from 0.9.28
      // ships both). Nothing is written into the fragment to say which.
    }
    function to(v) { return { redirect: '/versions/' + v + here }; }
    // MEETINGS RUN THE LIVE RELEASE. Releases are not compatible with each
    // other, so a room entry — a pretty /meet|/cast|/join path, or run.html
    // with anything but a solo app (#id=) — skips the pin for THIS page and
    // follows the release pointer like an unpinned visitor. gifos_pin is KEPT:
    // the Home Screen and solo apps stay on the pinned build.
    var room = !!pm || (/\/(run\.html|(meet|cast)(\.html)?)$/.test(pathname) && !/[#&]id=/.test(hash));
    if (room) pin = null;
    if (pin && pin !== window.GIFOS_VERSION) return to(pin);  // pinned to a DIFFERENT snapshot
    if (pin) return stay;                                     // already running what we're pinned to
    if (chan === 'edge') return stay;                         // opted into the edge build → run this root
    // Default channel follows the live release — but only on the real domain. On
    // localhost / preview hosts the root IS what you're developing, so stay edge.
    if (!/(^|\.)gifos\.app$/.test(location.hostname)) return stay;
    // Default: ASK for the release pointer, every entry, then redirect.
    // gifos_current is only what the LAST visit read. Trusting it first sent
    // every returning visitor to the release before the newest deploy (the first
    // load after 0.9.26 shipped landed on /versions/0.9.25.3/), and that
    // frozen snapshot can never move itself. The answer is under 2 KB
    // and a redirect costs a round trip anyway.
    // A visitor who HAS a stored release is asked without blocking, bounded by
    // VERSION_ASK_MS (the caller below, askLive): a stalled network must not
    // hold the page, so past the bound the stored release answers, as offline.
    // A first visit (nothing stored) is asked the same way and never blocks
    // either: a synchronous ask held a first visitor on a stalled network on a
    // blank page until the browser gave up (23 min in a stalled-network run).
    // With no answer in the bound it runs this edge build: the caller reloads
    // the page once with gifos_ask_edge set, and that load stays here.
    var once = null;
    try { once = sessionStorage.getItem('gifos_ask_edge'); if (once) sessionStorage.removeItem('gifos_ask_edge'); } catch (e) {}
    if (once) return stay;
    // `clear`: ?stable/?unpin/?latest just cleared a pin (the page still asks for the live release).
    // A ROOM LINK NEVER FALLS BACK INTO A BUILD THAT READS IT ANOTHER WAY. Releases before LINK_SINCE read #v= as
    // the room, so #room=R&v=V there would open a room named after the verifier. With no answer from version.json a
    // room link stays on this build (the first-visit path) rather than the remembered release when that is older.
    var LINK_SINCE = [0, 9, 28, 37];   // the first release with the one link grammar (js/core/link.js); set at its cut
    var named = !!pm || (room && !!window.GifOSLink && (function (r) { return !!(r.room || r.code); })(window.GifOSLink.read(pathname, '', hash)));
    if (named && cur) {
      var cv = String(cur).split('.').map(Number), older = false;
      for (var vi = 0; vi < 4; vi++) { var a = cv[vi] || 0, b = LINK_SINCE[vi]; if (a !== b) { older = a < b; break; } }
      if (older) cur = null;
    }
    return { redirect: cur ? to(cur).redirect : null, ask: here, clear: cleared || undefined };
  }
  window.gifosPinTarget = pinTarget;
  // GENERATED from gifos timings.json by scripts/gen-timings.mjs (the line below): do not edit by hand.
  var LOADER_T = { VERSION_ASK_MS: 1900, VERSION_FIRST_ASK_MS: 3900 };
  // The release is asked about without blocking: the rest of this page (the
  // edge build) is stopped at once, version.json gets LOADER_T.VERSION_ASK_MS
  // to answer, and the page moves to the live release or, on no answer, to the
  // stored one (first visit: this edge build). Exactly one move either way.
  function askLive(d) {
    var moved = false;
    function go(u) { if (moved) return; moved = true; location.replace(u); }
    // No answer: the stored release, or (first visit) this edge build, reached
    // by one marked reload. That edge build is the wrong build for a meeting,
    // so a first visit waits longer (VERSION_FIRST_ASK_MS) than a returning one. Without session storage there is no mark, so that
    // page is not stopped: it boots as the edge build unless the answer comes
    // in the bound.
    var mark = false;
    try { sessionStorage.setItem('gifos_ask_probe', '1'); sessionStorage.removeItem('gifos_ask_probe'); mark = true; } catch (e) {}
    function fallback() {
      if (d.redirect) { go(d.redirect); return; }
      if (moved || !mark) { moved = true; return; }
      moved = true;
      try { sessionStorage.setItem('gifos_ask_edge', '1'); } catch (e) {}
      location.reload();
    }
    if (d.redirect || mark) { try { window.stop(); } catch (e) {} }
    try {
      var x = new XMLHttpRequest(); x.open('GET', '/version.json?ts=' + Date.now(), true); x.timeout = d.redirect ? LOADER_T.VERSION_ASK_MS : LOADER_T.VERSION_FIRST_ASK_MS;
      x.onload = function () {
        // `latest` (may be four-part, 0.9.24.1) first; `current` is the three-part legacy pointer.
        var v = ''; try { var j = JSON.parse(x.responseText) || {}; v = (/^\d+\.\d+\.\d+(\.\d+)?$/.test(String(j.latest || '')) ? j.latest : ''); } catch (e) {}
        if (!/^\d+\.\d+\.\d+(\.\d+)?$/.test(String(v))) { fallback(); return; }
        try { localStorage.setItem('gifos_current', v); } catch (e) {}
        go('/versions/' + v + d.ask);
      };
      x.onerror = x.ontimeout = x.onabort = fallback;
      x.send();
    } catch (e) { fallback(); }
  }
  // ?agent=1 is read here, before the meeting rewrites its own address (agent mode reads window.__gifosAgentQ).
  // A driver that loads the page with its own start script (the agent SDK) may set the flag before this line.
  try { window.__gifosAgentQ = window.__gifosAgentQ === true || /[?&]agent=1(?:&|$)/.test(location.search); } catch (e) {}
  // bot=1 (query or hash) is assistant mode for this tab; agent=1 is assistant mode too (plus the agent API).
  // Read here, before the meeting rewrites its own address, and kept per tab so a reload stays an assistant.
  try { if (/[?#&](?:bot|agent)=1(?:&|$)/.test(location.search + '&' + location.hash)) sessionStorage.setItem('gifos_bot', '1'); } catch (e) {}
  var decision = pinTarget(location.pathname, location.search, location.hash);
  if (decision && decision.ask) askLive(decision);
  else if (decision && decision.redirect) location.replace(decision.redirect);
  // A meeting's address keeps the room in its fragment (/meet#room=…). Following
  // or typing another room's link there changes only the fragment, which loads
  // nothing, so the meeting would sit on under an address naming another room:
  // load again, and route.html opens the room the address names. The meeting's
  // own address moves use history.replaceState, which fires no hashchange.
  try { window.addEventListener('hashchange', function () { if (/^\/(?:meet|cast|join)\/?$/i.test(location.pathname)) location.reload(); }); } catch (e) {}
  // A document that stays refreshes gifos_current for the next visit.
  // The redirect above is still immediate. desktop.js is the other writer.
  try {
    if (typeof fetch === 'function') {
      fetch('/version.json', { cache: 'no-cache' }).then(function (r) {
        return r && r.ok ? r.json() : null;
      }).then(function (j) {
        var v = j && (/^\d+\.\d+\.\d+(\.\d+)?$/.test(String(j.latest || '')) ? j.latest : '');   // latest (may be 4-part) is the only pointer
        if (!v || !/^\d+\.\d+\.\d+(\.\d+)?$/.test(String(v))) return;
        try { localStorage.setItem('gifos_current', String(v)); } catch (e2) {}
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>

<title>Rooms</title>
<meta name="description" content="Rooms: your personal room, the private room you share with each contact, missed calls, ringing and the hosted rooms on this device.">
<link rel="canonical" href="https://gifos.app/rooms">
<link rel="icon" href="icon.svg">
<style>
  /* The meeting's tokens (css/meet.css), as the plans page has them: black surface, night cards, one accent. A light
     device gets paper and ink. Phone first: one column, 44px targets, sheets keep their buttons in view. */
  :root {
    --c-red: #b61622; --bg: #000; --card: #0c0e12; --chip: #222325; --line: #1c1f26; --text: #fff; --label: #dfe0e4;
    --muted: #8d93a0; --ring: #fff; --link: #9db4ff; --on-red: #fff; --ok: #3ccf7a; --danger: #ff6b6b;
    --r-sm: 10px; --r-md: 12px; --r-lg: 16px; --s-1: 4px; --s-2: 8px; --s-3: 16px; --s-4: 24px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f7fb; --card: #fff; --chip: #e8ecf1; --line: #e8ecf1; --text: #1d1d1f; --label: #3a3a3f; --muted: #5d6270;
            --ring: #1d1d1f; --link: #0064c8; --ok: #12813f; --danger: #c4212b; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  body.sheet-on { overflow: hidden; }
  [hidden] { display: none !important; }
  .wrap { max-width: 640px; margin: 0 auto; padding: var(--s-3) var(--s-3) 64px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-3); }
  h1 { font-size: 24px; font-weight: 700; }
  .top a { color: var(--label); font-size: 13px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
  h2 { font-size: 17px; font-weight: 700; }
  h3 { font-size: 14px; font-weight: 600; color: var(--label); margin: var(--s-3) 0 var(--s-1); }
  .quiet { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: var(--r-lg); padding: var(--s-3); margin-bottom: var(--s-3); display: grid; gap: var(--s-2); }
  .sec-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
  .room-line { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; }
  .room-name { font-size: 20px; font-weight: 700; word-break: break-all; }
  .acts, .stack { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .stack { flex-direction: column; margin: var(--s-3) 0; }
  button { font: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: var(--chip); border: 0; border-radius: var(--r-sm);
    padding: var(--s-2) 14px; min-height: 44px; cursor: pointer; }
  button.go { background: var(--c-red); color: var(--on-red); }
  button.text { background: none; color: var(--link); padding: var(--s-2) 0 var(--s-2) var(--s-2); }

  footer button.danger { background: var(--danger); color: #fff; border: 0; }
  button.wide { width: 100%; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  #sec-settings > button.danger { justify-self: start; margin-top: var(--s-2); }
  .rows { list-style: none; display: grid; }
  .row { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) 0; border-top: 1px solid var(--line); min-height: 56px; }
  .row:first-child { border-top: 0; }
  .row .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  .row .main b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .row button.as-text { background: none; padding: 0; min-height: 44px; justify-content: center; color: var(--text); }
  .row button.as-text .quiet { font-weight: 400; }
  .ok { color: var(--ok); }
  .av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;

  label { display: block; font-size: 13px; color: var(--label); margin-bottom: var(--s-1); }
  label.switch { display: flex; align-items: center; gap: var(--s-2); min-height: 44px; font-size: 14px; color: var(--text); cursor: pointer; }
  label.switch input { width: 20px; height: 20px; flex: none; }
  input:not([type]), input[type="text"] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--chip); border-radius: var(--r-sm); min-height: 44px; padding: 0 12px; width: 100%; }
  #card-link { margin-top: var(--s-2); font-size: 12px; color: var(--muted); }
  .qr { background: #fff; border-radius: var(--r-sm); padding: var(--s-2); max-width: 240px; margin-top: var(--s-2); }
  .qr svg { display: block; width: 100%; height: auto; }

  /* The Doorbell's block (js/core/view/bell.js paints it with the meeting's class names). */
  .bell { display: grid; gap: var(--s-2); }
  .bell .lob-quiet, .bell .set-help { color: var(--muted); font-size: 13px; }
  .bell .rec-opt { display: flex; align-items: flex-start; gap: var(--s-2); min-height: 44px; font-size: 14px; color: var(--text); cursor: pointer; margin: 0; }
  .bell .rec-opt input { width: 20px; height: 20px; flex: none; margin-top: 2px; }
  .bell .rec-opt span { display: grid; gap: 2px; }
  .bell .rec-opt small { color: var(--muted); font-size: 13px; }
  .bell .bell-devs { display: grid; }
  .bell .bell-devs > b { font-size: 14px; font-weight: 600; color: var(--label); margin-top: var(--s-2); }
  .bell .lob-item { display: flex; align-items: center; gap: var(--s-2); min-height: 48px; border-top: 1px solid var(--line); }
  .bell .li-main { flex: 1 1 auto; min-width: 0; }
  .bell .row-del { background: none; color: var(--danger); padding: var(--s-2); min-width: 44px; }
  .bell .lob-ghost { justify-self: start; }

  /* Sheets: a sticky header (title + Close) and a sticky footer (the actions); only the middle scrolls. A bottom sheet on
     a phone, a centred card on a wide screen. */
  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-back > .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 520px; max-height: 88vh; max-height: 88dvh;
    border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.4); }
  .sheet header, .sheet footer { flex: none; display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); }
  .sheet header { justify-content: space-between; border-bottom: 1px solid var(--line); }
  .sheet footer { justify-content: flex-end; border-top: 1px solid var(--line); padding-bottom: max(var(--s-2), env(safe-area-inset-bottom)); }
  .sheet-body { padding: var(--s-3); display: grid; gap: var(--s-2); }
  .sheet-body p + p { margin-top: var(--s-1); }
  @media (min-width: 700px) { .sheet-back { align-items: center; } .sheet-back > .sheet { border-radius: var(--r-lg); } }
</style>
