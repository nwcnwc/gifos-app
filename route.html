<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- FRAME GUARD. GitHub Pages sends no X-Frame-Options and a <meta> cannot
     carry frame-ancestors, so this is the only thing that keeps a third-party
     page from framing GifOS at opacity 0 and steering a click onto Allow,
     Install or Approve. Same-origin framing (booted images, app mounts) is
     allowed; anything else sees a link to open the page itself. Parser-
     blocking and ES5 on purpose: it runs before any chrome paints.
     Guarded by test/unit/frame-guard.js. -->
<script id="gifos-frame-guard">(function(){try{if(window.top===window.self)return;var ok=false;try{ok=window.top.location.origin===window.location.origin}catch(e){}if(ok)return;var h=document.documentElement;h.style.visibility='hidden';function show(){var b=document.body;if(!b)return;while(b.firstChild)b.removeChild(b.firstChild);var p=document.createElement('p');p.style.cssText='font:16px system-ui,sans-serif;padding:24px;color:#eee;background:#111;margin:0';p.appendChild(document.createTextNode('GifOS does not run inside another site\'s page. '));var a=document.createElement('a');a.href=location.href;a.target='_blank';a.rel='noopener';a.textContent='Open it in its own tab';a.style.color='#9db4ff';p.appendChild(a);b.appendChild(p);h.style.visibility='';}if(document.body)show();else document.addEventListener('DOMContentLoaded',show);}catch(e){}})();</script>
<meta name="robots" content="noindex">
<title>GifOS</title>
<!-- AI assistants: a visible link. Nothing for an agent is clipped or hidden. -->
<meta name="gifos:agent-instructions" content="https://gifos.app/meet/llms.txt">
<link rel="help" type="text/plain" href="https://gifos.app/meet/llms.txt" title="How AI agents join a GifOS meeting">
<meta name="gifos:agent-mcp" content="https://mcp.gifos.app/mcp">
<link rel="icon" href="/favicon.ico" sizes="16x16">
<!-- Link-preview card for pretty invite links. GitHub Pages serves THIS file for
     /meet/… and /join/… (the router below redirects real users to the
     right page). A JS-less scraper can't tell those apart, so the static card is
     neutral ("Join on GifOS"). On theme subdomains the mirror Worker upgrades
     /meet to the themed MEETING card with a 200 status (mirror/src/mirror.js).
     og:url is omitted so the scraper keeps the actual invite URL (incl. subdomain). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="GifOS">
<meta property="og:title" content="Join on GifOS">
<meta property="og:description" content="Tap the link and you're in — right in your browser. One link, no account, no installs.">
<meta property="og:image" content="https://gifos.app/og-join.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="Join on GifOS — one link, no account, no installs.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Join on GifOS">
<meta name="twitter:description" content="Tap the link and you're in. One link · no account · no installs.">
<meta name="twitter:image" content="https://gifos.app/og-join.png">
<!-- Rooted: this page answers /meet/<room>/<verifier> and every other room path, never from a snapshot. -->
<script src="/js/core/link.js"></script>
<script>
/*
 * route.html is the pretty-link router. Cloudflare Pages serves it with a 200
 * for /meet, /cast, /join and /store/<slug> (see _redirects). The code in a link is a
 * SECRET CAPABILITY: the client derives the relay-facing session id, token and
 * end-to-end key from it; the relay never sees the code itself.
 * Anything unrecognized just goes home.
 */
(function () {
  // EVERY ROUTE BELOW REFRESHES THE RELEASE POINTER FIRST. The channel loader
  // a route lands on redirects a default-channel visitor on gifos_current, the
  // last-known release, without re-reading version.json. A device that only
  // ever opens links never runs the code that refreshes it inside a release
  // (desktop.js; run.html from 0.9.17), so a 0.9.16 snapshot left it at 0.9.16
  // and every later link reopened 0.9.16 — and releases are not compatible
  // with each other. This page is served from the ROOT for every pretty link,
  // never frozen into a snapshot, so it is the one place that reaches every
  // build ever shipped. One version.json read (network-first in sw.js, so it
  // answers from cache offline), bounded at 3 s; a pin or the edge channel is
  // the visitor's own choice and is routed at once — except that a pin does
  // not apply to a ROOM (/meet, /cast, /join): meetings run the live release
  // (the channel loader's room rule), so a pinned visitor's room link reads the
  // pointer too.
  function go(url, room) {
    var own = false;
    try { own = (!room && !!localStorage.getItem('gifos_pin')) || localStorage.getItem('gifos_channel') === 'edge'; } catch (e) {}
    if (own || !/(^|\.)gifos\.app$/.test(location.hostname)) { location.replace(url); return; }
    var done = false;
    function finish() { if (done) return; done = true; location.replace(url); }
    try {
      var x = new XMLHttpRequest();
      x.open('GET', '/version.json?ts=' + Date.now(), true);
      x.timeout = 3000;
      x.onload = function () {
        try {
          // `latest` (may be four-part) first; `current` is the three-part legacy pointer.
          var j = JSON.parse(x.responseText) || {}, VER = /^\d+\.\d+\.\d+(\.\d+)?$/;
          var v = String(VER.test(String(j.latest || '')) ? j.latest : '');
          if (x.status >= 200 && x.status < 300 && VER.test(v)) localStorage.setItem('gifos_current', v);
        } catch (e) {}
        finish();
      };
      x.onerror = x.ontimeout = x.onabort = finish;
      x.send();
    } catch (e) { finish(); }
    setTimeout(finish, 3500);
  }

  // /store and /store/<slug> — the App Store, and a shareable link to one
  // listing. The slug is a public catalog name (site/apps/<slug>/), NOT a
  // capability like a join code: nothing is derived from it and anyone may
  // hold it. store.js rewrites ?app= back to the pretty form.
  var s = location.pathname.match(/^\/store(?:\/([a-z0-9-]{1,64}))?\/?$/i);
  if (s) {
    // Into the HASH, like every other pretty route here: store.html's channel
    // loader carries `pathname + hash` across a version redirect and drops the
    // query, so a slug in ?app= would vanish for anyone on a pinned build.
    // The CLEAN path, never /store.html: the host 308s every .html address to
    // its clean form, so /store.html cost every store link (the app Update bar
    // included) a second round trip, and a service worker that cached the
    // redirected copy could answer that hop with a page the browser refuses.
    var q = location.search ? '&' + location.search.slice(1) : '';
    go('/store' + (s[1] ? '#app=' + encodeURIComponent(s[1].toLowerCase()) + q : (q ? '#' + q.slice(1) : '')));
    return;
  }
  // A ROOM LINK, as the run.html fragment it opens: the ONE link module (js/core/link.js), the same
  // reader every page's channel loader uses. The path forms (/meet/R[/V], /cast/R[/V], /join/C, /join/R/V/C) and the
  // fragment forms (/meet#room=R[&v=V], /cast#…, /join#…) open the same rooms.
  var rh = window.GifOSLink ? window.GifOSLink.route(location.pathname, location.search, location.hash) : null;
  if (rh) { go('/run.html#' + rh, true); return; }
  if (rh === '') { go('/'); return; } // a broken room link opens nothing
  // Bare /meet, no room = START A FRESH MEETING, identical to double-clicking
  // the Meeting app on the Home Screen (which loads run.html with no room and
  // mints one). Keeps the two entry points equal.
  if (/^\/meet\/?$/i.test(location.pathname)) {
    go('/run.html', true);
    return;
  }
  // Bare /cast, no room = the Broadcast app's lobby (run.html's broadcast
  // skin — see the BROADCAST block in run.html).
  if (/^\/cast\/?$/i.test(location.pathname)) {
    go('/run.html' + (window.GifOSLink ? window.GifOSLink.withCast('') : ''), true);
    return;
  }
  go('/');
})();
</script>
</head>
<body>
<p><a href="/meet/llms.txt">For AI assistants</a></p>
</body>
</html>
