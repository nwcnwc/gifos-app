<!-- FRAME GUARD: the one GifOS page another site may frame is this one, at its exact path
     (/embed, /versions/<x.y.z>/embed; Cloudflare serves embed.html there). Anywhere else
     the guard refuses like every other page. Guarded by gifos page-guards frame-guard. -->
<script id="gifos-frame-guard">(function(){try{var E=/^\/(versions\/\d+(\.\d+){2,3}\/)?embed(\.html)?$/.test(location.pathname);window.__gifosEmbed=E;if(E)return;if(window.top===window.self)return;var ok=false;try{ok=window.top.location.origin===window.location.origin;if(!ok&&window.location.origin==='null')ok=window.top.location.origin===window.parent.location.origin;}catch(e){}if(ok)return;var h=document.documentElement;h.style.visibility='hidden';function show(){var b=document.body;if(!b)return;while(b.firstChild)b.removeChild(b.firstChild);var p=document.createElement('p');p.style.cssText='font:16px system-ui,sans-serif;padding:24px;color:#eee;background:#111;margin:0';p.appendChild(document.createTextNode('GifOS does not run inside another site\'s page. '));var a=document.createElement('a');a.href=location.href;a.target='_blank';a.rel='noopener';a.textContent='Open it in its own tab';a.style.color='#9db4ff';p.appendChild(a);b.appendChild(p);h.style.visibility='';}if(document.body)show();else document.addEventListener('DOMContentLoaded',show);}catch(e){}})();</script>

<!-- RELEASE POINTER. A broadcast runs the live release: the root page moves to
     /versions/<latest>/embed (the same release's embed.html) with its hash. A snapshot
     stays; a host that is not gifos.app (local, preview) stays on what it serves. -->
<script>
(function () {
  if (location.pathname.indexOf('/versions/') !== -1 || !/(^|\.)gifos\.app$/.test(location.hostname)) return;
  var done = false;
  function stay() { done = true; }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/version.json?ts=' + Date.now(), true);
    x.timeout = 3000;
    x.onload = function () {
      if (done) return;
      try {
        var j = JSON.parse(x.responseText) || {}, v = String(j.latest || '');
        if (x.status >= 200 && x.status < 300 && /^\d+\.\d+\.\d+(\.\d+)?$/.test(v)) { done = true; location.replace('/versions/' + v + '/embed' + location.hash); return; }
      } catch (e) {}
      stay();
    };
    x.onerror = x.ontimeout = x.onabort = stay;
    x.send();
  } catch (e) { stay(); }
})();
</script>
