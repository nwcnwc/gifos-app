<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light">
<!-- Calendar stays on this device. The library is written in at the marker. -->
<title>Calendar</title>
<style>
  :root{
    --c-bg:#0a0a0f;--c-card:#14141f;--c-card2:#1c1c2b;--c-line:#2a2a3f;
    --c-text:#e0e0f0;--c-muted:#8888aa;--c-accent:#7b5cff;--c-accent2:#ff5caa;--c-on:#fff;
    --c-danger:#e15b6a;--c-ok:#3d9a6a;
  }
  html[data-scheme="light"]{
    --c-bg:#f4f5fb;--c-card:#ffffff;--c-card2:#e8eaf3;--c-line:#d5d8e6;
    --c-text:#1a1c28;--c-muted:#5c6178;--c-accent:#5a3fd4;--c-accent2:#c4316c;--c-on:#fff;
    --c-danger:#b4233a;--c-ok:#0d7a45;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;max-width:100%}
  body{background:var(--c-bg);color:var(--c-text);font:15px system-ui,sans-serif;display:flex;flex-direction:column}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid #7b5cff;outline-offset:2px}
  header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--c-card);border-bottom:1px solid var(--c-line);flex:none}
  header h1{flex:1;min-width:0;margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
  header button,.nav button,.dlg-actions button,.iconbtn{min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-card2);color:var(--c-text);padding:0 12px}
  button.go{background:#7b5cff;border-color:#7b5cff;color:#fff;font-weight:700}
  button.danger{color:var(--c-danger)}
  button.x{min-width:44px;padding:0;font-size:1.3rem;line-height:1}
  .nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--c-card);border-bottom:1px solid var(--c-line);flex:none}
  .seg{display:flex;flex:1 1 100%;min-width:0;max-width:100%;border:1px solid var(--c-line);border-radius:10px;overflow:hidden}
  @media(min-width:900px){.seg{flex:0 0 auto;margin-left:auto}.seg button{flex:0 0 auto}}
  .seg button{flex:1 1 auto;min-width:0;border:0;border-radius:0;border-right:1px solid var(--c-line);padding:0 10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg button:last-child{border-right:0}
  .seg button[aria-selected="true"]{background:#7b5cff;color:#fff}
  #view{flex:1;min-height:0;overflow:auto;overflow-x:hidden;padding:8px}
  #view:has(.week){padding:0;overflow:hidden}
  .err{color:var(--c-danger);font-size:.85rem;min-height:0;padding:0 10px}
  .quiet{color:var(--c-muted);font-size:.85rem}
  #month{display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto}
  @media(min-width:760px){#month{flex-direction:row;align-items:flex-start}#month .cal{flex:1.3}#month .side{flex:1;min-width:0}}
  .wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .wd i{font-style:normal;text-align:center;font-size:.72rem;color:var(--c-muted);padding:2px 0}
  .cell{min-width:0;background:var(--c-card);border-radius:8px;display:flex;flex-direction:column;min-height:44px}
  .cell .num{flex:none;width:32px;height:32px;min-height:32px;margin:4px auto 0;padding:0;border:0;background:transparent;color:inherit;border-radius:50%;font-variant-numeric:tabular-nums}
  .cell.out{opacity:.4}
  .cell.today .num{box-shadow:inset 0 0 0 2px #7b5cff;font-weight:800}
  .cell.sel .num{background:#7b5cff;color:#fff;font-weight:800}
  .cell.sel.today .num{box-shadow:none}
  .dots{display:flex;justify-content:center;gap:2px;min-height:8px;padding-bottom:3px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--c-accent2)}
  .cell .chips{display:none}
  @media(min-width:760px){
    .cell{min-height:78px}
    .cell .chips{display:flex;flex-direction:column;gap:2px;padding:0 3px 4px}
    .chip{text-align:left;border:0;background:transparent;color:var(--c-text);font-size:.72rem;padding:1px 2px 1px 6px;border-left:3px solid var(--c-accent2);min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  }
  .side h2{margin:0 0 8px;font-size:1rem}
  .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .list li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--c-card);border:1px solid var(--c-line);min-height:44px}
  .list button.item{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;display:flex;gap:8px;align-items:baseline}
  .list .t{color:var(--c-muted);font-size:.82rem;min-width:4.6em;font-variant-numeric:tabular-nums}
  .list .n{min-width:0;overflow-wrap:anywhere}
  .week{display:flex;flex-direction:column;height:100%;min-height:0;min-width:0}
  .week-row{display:flex;min-width:0;flex:none}
  .week-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
  .days-x{overflow-x:auto;overflow-y:hidden;flex:1;min-width:0}
  .gutter,.hlabs{flex:none;width:48px;background:var(--c-bg)}
  .days{display:flex}
  .dh,.ad,.col{flex:0 0 auto}
  .dh{font-size:.75rem;text-align:center;padding:4px 2px;min-height:44px}
  .dh b{display:block;font-size:1rem}
  .dh.today b{background:#7b5cff;color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;margin:0 auto}
  .ad{min-height:28px;padding:1px}
  .ad button{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c-accent2);background:var(--c-card);border-radius:4px;font-size:.72rem;padding:2px 4px;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hours{display:flex;position:relative;min-width:0}
  .hlabs{position:relative}
  .hlabs span{position:absolute;right:4px;font-size:.68rem;color:var(--c-muted);transform:translateY(-50%)}
  .col{position:relative;border-left:1px solid var(--c-line);background-image:repeating-linear-gradient(to bottom,transparent,transparent 47px,var(--c-line) 48px)}
  .ev{position:absolute;overflow:hidden;border:0;border-left:3px solid var(--c-accent2);background:var(--c-card);border-radius:6px;text-align:left;padding:2px 4px;font-size:.75rem;line-height:1.2;z-index:1}
  .ev b,.ev .quiet{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--c-accent2);z-index:2;pointer-events:none}
  .nowline::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--c-accent2)}
  .agenda{max-width:720px;margin:0 auto}
  .agenda h3{position:sticky;top:0;background:var(--c-bg);margin:12px 0 6px;font-size:.95rem}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .modal{background:var(--c-card);color:var(--c-text);width:min(560px,100%);max-height:92dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:0 8px 40px rgba(0,0,0,.35)}
  @media(min-width:700px){.modal-bg{align-items:center;padding:16px}.modal{border-radius:16px;max-height:86dvh}}
  .dlg-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--c-line);flex:none}
  .dlg-head h2{flex:1;min-width:0;margin:0;font-size:1.05rem}
  .dlg-body{flex:1 1 auto;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .dlg-actions{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--c-line);background:var(--c-card);position:sticky;bottom:0}
  .dlg-actions button{flex:1 1 auto}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--c-muted)}
  label.f input,label.f select,label.f textarea,input.txt,select.txt{background:var(--c-bg);border:1px solid var(--c-line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%;min-width:0}
  textarea{min-height:88px;resize:vertical}
  .row2{display:flex;flex-wrap:wrap;gap:8px}
  .row2>*{flex:1 1 9rem;min-width:0}
  .switch{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--c-text)}
  .switch input{width:22px;height:22px}
  .daysel{display:flex;flex-wrap:wrap;gap:4px}
  .daysel button{min-width:40px;min-height:40px;border-radius:50%;padding:0}
  .daysel button.on{background:#7b5cff;color:#fff;border-color:#7b5cff}
  .zone-list{max-height:180px;overflow:auto;border:1px solid var(--c-line);border-radius:8px}
  .zone-list button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--c-line);border-radius:0;min-height:44px}
  .zone-list button.on{background:var(--c-card2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border-radius:999px;min-height:36px;padding:0 10px;font-size:.85rem}
  .swatches{display:flex;flex-wrap:wrap;gap:4px}
  .swatch{width:44px;height:44px;border-radius:50%;padding:0;border:2px solid transparent;background:transparent}
  .swatch i{display:block;width:22px;height:22px;border-radius:50%;margin:auto;pointer-events:none}
  .swatch.on{border-color:var(--c-text)}
  .calrow{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--c-line)}
  .calrow .nm{flex:1;min-width:0}
  .calrow .ops{display:flex;flex-wrap:wrap;gap:4px}
  .calrow .ops button{min-height:36px;padding:0 8px;font-size:.8rem}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .banner{position:fixed;left:8px;right:8px;bottom:8px;z-index:50;background:var(--c-card);border:1px solid var(--c-line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .banner .acts{display:flex;flex-wrap:wrap;gap:6px}
  .banner .acts button{flex:1;min-height:44px}
  .drop{outline:2px dashed #7b5cff;outline-offset:-6px}
  a{color:#7b5cff}
  .note{white-space:pre-wrap;overflow-wrap:anywhere}
  #bell{position:relative}
  #bell svg{display:block}
  #badge{position:absolute;top:2px;right:2px;min-width:1.1em;padding:0 4px;border-radius:999px;background:var(--c-accent2);color:#fff;font-size:.68rem;font-weight:700;line-height:1.3}
  #badge[hidden]{display:none}
  html[data-scheme="light"] button.go,html[data-scheme="light"] .seg button[aria-selected="true"],html[data-scheme="light"] .cell.sel .num,html[data-scheme="light"] .daysel button.on,html[data-scheme="light"] .dh.today b{background:#5a3fd4;border-color:#5a3fd4;color:#fff}
</style>
<header>
  <button type="button" id="cals" class="iconbtn" data-i18n-aria="menuAria" aria-label="Calendars">☰</button>
  <h1 id="title">Calendar</h1>
  <button type="button" id="bell" hidden data-i18n-aria="inbox" aria-label="Invitations"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 22a2.4 2.4 0 0 0 2.35-2h-4.7A2.4 2.4 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3.5a2 2 0 1 0-4 0v.8A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg><span id="badge" hidden>0</span></button>
  <button type="button" id="add" class="go" data-i18n-aria="addAria" aria-label="New event">+</button>
</header>
<div class="nav">
  <button type="button" id="prev" data-i18n-aria="prev" aria-label="Previous">‹</button>
  <button type="button" id="today" data-i18n="today">Today</button>
  <button type="button" id="next" data-i18n-aria="next" aria-label="Next">›</button>
  <div class="seg" id="views" role="tablist" data-i18n-aria="views" aria-label="View">
    <button type="button" data-view="month" role="tab">Month</button>
    <button type="button" data-view="week" role="tab">Week</button>
    <button type="button" data-view="day" role="tab">Day</button>
    <button type="button" data-view="agenda" role="tab">Agenda</button>
  </div>
</div>
<p id="err" class="err" role="status"></p>
<main id="view"></main>
<div id="sheets"></div>
<div id="alarm" class="banner" hidden role="alert"></div>
<input type="file" id="file" accept=".ics,text/calendar" multiple hidden>

    root.querySelector('#set-week').value = s.weekStart == null ? '' : String(s.weekStart);
    root.querySelector('#set-rem').value = String(s.reminder);
    root.querySelector('#set-meet').value = s.meetMode === 'open' ? 'open' : 'hosted';
    function save() {
      state.settings.view = root.querySelector('#set-view').value;
      var w = root.querySelector('#set-week').value;
      state.settings.weekStart = w === '' ? null : +w;
      state.settings.reminder = parseInt(root.querySelector('#set-rem').value, 10);
      state.settings.meetMode = root.querySelector('#set-meet').value === 'open' ? 'open' : 'hosted';
      state.view = state.settings.view;
      saveSettings(); render();
    }
    ['#set-view', '#set-week', '#set-rem', '#set-meet'].forEach(function (sel) { root.querySelector(sel).onchange = save; });
  }
  function saveSettings() {
    var row = { id: 'settings', view: state.settings.view, weekStart: state.settings.weekStart, reminder: state.settings.reminder, meetMode: state.settings.meetMode };
    state.settingsKnown = true;
    return db('calendar_settings').put(row);
  }

  function onFiles(fileList) {
    var files = [].slice.call(fileList || []);
    if (!files.length) return;
    Promise.all(files.map(function (f) {
      return readFile(f).then(function (text) {
        var parsed = I.parse(text);
        return { name: f.name, parsed: parsed };
      }, function () { return { name: f.name, error: true, parsed: { events: [], calendars: [], warnings: [] } }; });
    })).then(function (packs) { previewImport(packs); }).catch(function () { say(T('importFail')); });
  }
  function previewImport(packs) {
    var body = packs.map(function (p, i) {
      if (p.error) return '<p>' + esc(p.name) + ': ' + esc(T('importFail')) + '</p>';
      var n = (p.parsed.events || []).length;
      var calName = (p.parsed.calendars && p.parsed.calendars[0] && p.parsed.calendars[0].name) || p.name.replace(/\.ics$/i, '');
      var options = state.calendars.filter(function (c) { return !c.readonly; }).map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (state.importTarget === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
      }).join('');
      options += '<option value="new:' + i + '">' + esc(T('importNew', { name: calName || T('defaultCalendar') })) + '</option>';
      var warns = (p.parsed.warnings || []).slice(0, 8).map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('');
      return '<section data-pack="' + i + '"><p><b>' + esc(n ? T('importCount', { n: n, name: calName || p.name }) : T('importEmpty')) + '</b></p><label class="f">' + esc(T('importTarget')) + '<select data-target="' + i + '">' + options + '</select></label>' + (warns ? '<p class="quiet">' + esc(T('importWarn')) + '</p><ul>' + warns + '</ul>' : '') + '</section>';
    }).join('') + '<p class="quiet">' + esc(T('importDup')) + '</p>';
    openSheet({
      title: T('importTitle'),
      body: body,
      actions: [
        { label: T('importGo'), go: true, fn: function (close, root) { runImport(packs, root).then(function () { close(); render(); pushAlarms(); }); } },
        { label: T('cancel'), fn: function (close) { close(); } }
      ]
    });
  }
  function runImport(packs, root) {
    var jobs = [];
    packs.forEach(function (p, i) {
      if (p.error || !p.parsed || !p.parsed.events) return;
      var sel = root.querySelector('[data-target="' + i + '"]');
      var target = sel ? sel.value : '';
      var chain = Promise.resolve(target);
      if (target.indexOf('new:') === 0) {
        var calName = (p.parsed.calendars && p.parsed.calendars[0] && p.parsed.calendars[0].name) || p.name.replace(/\.ics$/i, '') || T('defaultCalendar');
        var col = (p.parsed.calendars && p.parsed.calendars[0] && p.parsed.calendars[0].color) || '';
        if (!/^#[0-9a-fA-F]{6}$/.test(col)) col = PALETTE[state.calendars.length % PALETTE.length];
        var cal = { id: 'cal-' + Math.random().toString(36).slice(2, 10), name: calName, color: col, hidden: false };
        state.calendars.push(cal);
        chain = db('calendars').put(cal).then(function () { return cal.id; });
      }
      jobs.push(chain.then(function (calId) {
        if (!calId || String(calId).indexOf('new:') === 0) calId = defaultCal().id;
        return Promise.all(p.parsed.events.map(function (ev) {
          var made = I.makeEvent(ev);
          made.cal = calId;
          made.id = rowId(made);
          return putEvent(made);
        }));
      }));
    });
    state.importTarget = '';
    return Promise.all(jobs);
  }

  function openInbox() {
    var rows = state.invites.slice().sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
    var body = rows.length ? rows.map(function (r) {
      var kind = r.kind === 'reply' ? T('kindReply') : r.kind === 'cancel' ? T('kindCancel') : T('kindRequest');
      var who = (r.from && r.from.name) || (r.from && r.from.cid) || '';
      var title = '';
      try { var inv = I.readInvite(r.ics); title = (inv.event && inv.event.title) || ''; } catch (e) {}
      var acts = r.state === 'new' && r.kind === 'request'
        ? '<div class="ops"><button type="button" data-acc="' + esc(r.id) + '" class="go">' + esc(T('accept')) + '</button><button type="button" data-maybe="' + esc(r.id) + '">' + esc(T('maybe')) + '</button><button type="button" data-no="' + esc(r.id) + '">' + esc(T('decline')) + '</button></div>'
        : '<span class="quiet">' + esc(r.state || '') + '</span>';
      return '<div class="calrow" style="flex-wrap:wrap"><div class="nm"><b>' + esc(title || kind) + '</b><div class="quiet">' + esc(T('from', { name: who })) + ' · ' + esc(kind) + '</div></div>' + acts + '</div>';
    }).join('') : '<p class="quiet">' + esc(T('inboxEmpty')) + '</p>';
    openSheet({
      title: T('inbox'),
      body: body,
      actions: [{ label: T('close'), fn: function (close) { close(); } }],
      onBind: function (root, close) {
        function act(id, part) { var row = inviteBy(id); if (row) respondInvite(row, part, close); }
        [].forEach.call(root.querySelectorAll('[data-acc]'), function (b) { b.onclick = function () { act(b.getAttribute('data-acc'), 'ACCEPTED'); }; });
        [].forEach.call(root.querySelectorAll('[data-maybe]'), function (b) { b.onclick = function () { act(b.getAttribute('data-maybe'), 'TENTATIVE'); }; });
        [].forEach.call(root.querySelectorAll('[data-no]'), function (b) { b.onclick = function () { act(b.getAttribute('data-no'), 'DECLINED'); }; });
      }
    });
  }
  function inviteBy(id) { for (var i = 0; i < state.invites.length; i++) if (state.invites[i] && state.invites[i].id === id) return state.invites[i]; return null; }
  function respondInvite(row, part, closeInbox) {
    var parsed = { event: null };
    try { parsed = I.readInvite(row.ics || ''); } catch (e) {}
    var ev = parsed.event;
    function finish(stateName) {
      row.state = stateName;
      db('invites').put(row).then(function () { bridge.ack(row.id); badge(); closeInbox(); render(); });
    }
    if (part === 'DECLINED' || !ev) {
      if (ev && row.from && row.from.cid && bridge.hasSend()) {
        try { bridge.send(row.from.cid, I.makeRequest(ev, { method: 'REPLY', partstat: part, attendee: { name: row.from.name, cid: row.from.cid } }), 'reply'); } catch (e) {}
      }
      finish(part === 'DECLINED' ? 'declined' : 'done');
      return;
    }
    var options = state.calendars.filter(function (c) { return !c.readonly; }).map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
    }).join('');
    openSheet({
      title: part === 'TENTATIVE' ? T('maybe') : T('accept'),
      body: '<label class="f">' + esc(T('acceptInto')) + '<select id="into">' + options + '</select></label>',
      actions: [
        { label: T('save'), go: true, fn: function (close, root) {
          var made = I.makeEvent(ev);
          made.cal = root.querySelector('#into').value || defaultCal().id;
          made.id = rowId(made);
          putEvent(made).then(function () {
            if (row.from && row.from.cid && bridge.hasSend()) {
              try { bridge.send(row.from.cid, I.makeRequest(made, { method: 'REPLY', partstat: part, attendee: { name: row.from.name, cid: row.from.cid } }), 'reply'); } catch (e) {}
            }
            close(); finish(part === 'TENTATIVE' ? 'tentative' : 'accepted'); pushAlarms();
          });
        } },
        { label: T('cancel'), fn: function (close) { close(); } }
      ]
    });
  }
  function ingest(msg) {
    if (!msg || !msg.id) return;
    var existing = inviteBy(msg.id);
    if (existing) { bridge.ack(msg.id); return; }
    var row = { id: msg.id, from: msg.from || { cid: '', name: '' }, kind: msg.kind || 'request', ics: msg.ics || '', at: Date.now(), state: 'new' };
    if (row.kind === 'reply' || row.kind === 'cancel') applyIncoming(row);
    state.invites.push(row);
    db('invites').put(row).then(function () { bridge.ack(row.id); badge(); });
  }
  function applyIncoming(row) {
    var parsed = null;
    try { parsed = I.readInvite(row.ics); } catch (e) { parsed = null; }
    var ev = parsed && parsed.event; if (!ev || !ev.uid) { row.state = 'done'; return; }
    if (row.kind === 'cancel') {
      state.events.forEach(function (e) { if (e && e.uid === ev.uid) { e.status = 'CANCELLED'; putEvent(e); } });
      row.state = 'done'; return;
    }
    var who = row.from || {};
    state.events.forEach(function (e) {
      if (!e || e.uid !== ev.uid || !e.attendees) return;
      e.attendees.forEach(function (a) {
        if ((who.cid && a.cid === who.cid) || (who.name && a.name === who.name)) {
          var part = (ev.attendees && ev.attendees[0] && ev.attendees[0].partstat) || 'ACCEPTED';
          a.partstat = part;
        }
      });
      putEvent(e);
    });
    row.state = 'done';
  }

  function pushAlarms() {
    clearTimeout(state._alarmT);
    state._alarmT = setTimeout(pushAlarmsNow, 300);
  }
  function pushAlarmsNow() {
    if (!I || !bridge.hasAlarms()) return;
    var from = Date.now(), to = from + 14 * 86400000, list = [], i, j;
    var evs = state.events;
    for (i = 0; i < evs.length && list.length < 200; i++) {
      var e = evs[i];
      if (!e || !e.alarms || !e.alarms.length || hiddenCal(e.cal) || e.status === 'CANCELLED') continue;
      var times = [];
      try { times = I.alarmTimes(e, from, to); } catch (err) { times = []; }
      for (j = 0; j < times.length && list.length < 200; j++) {
        var a = times[j];
        var key = (e.uid || '') + ':' + a.atMs;
        if (state.dismissed[key]) continue;
        list.push({ atMs: state.snooze[key] || a.atMs, startMs: a.startMs, uid: e.uid, title: e.title || T('untitled'), link: linkOf(e) });
      }
    }
    list.sort(function (a, b) { return a.atMs - b.atMs; });
    bridge.setAlarms(list.slice(0, 200));
  }
  function checkAlarms() {
    if (!I) return;
    var now = Date.now(), best = null;
    state.events.forEach(function (e) {
      if (!e || !e.alarms || !e.alarms.length || hiddenCal(e.cal)) return;
      var times = [];
      try { times = I.alarmTimes(e, now - 10 * 60000, now + 60000); } catch (err) { times = []; }
      times.forEach(function (a) {
        var key = (e.uid || '') + ':' + a.atMs;
        var at = state.snooze[key] || a.atMs;
        if (state.dismissed[key] || at > now || now - at > 10 * 60000) return;
        if (!best || at < best.at) best = { at: at, key: key, title: e.title || T('untitled'), link: linkOf(e), startMs: a.startMs, event: e };
      });
    });
    var box = document.getElementById('alarm');
    if (!best) { box.hidden = true; state.alarm = null; return; }
    if (state.alarm && state.alarm.key === best.key) return;
    state.alarm = best;
    box.hidden = false;
    var when = fmt(best.startMs, hourCycle({ weekday: 'short', hour: 'numeric', minute: '2-digit' }));
    box.innerHTML = '<b>' + esc(best.title) + '</b><div class="quiet">' + esc(now >= best.startMs - 60000 ? T('dueNow') : T('dueSoon')) + ' · ' + esc(when) + '</div><div class="acts">' +
      (best.link ? '<button type="button" class="go" id="al-join">' + esc(T('join')) + '</button>' : '') +
      '<button type="button" id="al-snooze">' + esc(T('snooze')) + '</button><button type="button" id="al-dismiss">' + esc(T('dismiss')) + '</button></div>';
    var j = document.getElementById('al-join');
    if (j) j.onclick = function () { bridge.open(best.link); };
    document.getElementById('al-snooze').onclick = function () {
      state.snooze[best.key] = Date.now() + 5 * 60000; state.alarm = null; box.hidden = true; pushAlarms();
    };
    document.getElementById('al-dismiss').onclick = function () {
      state.dismissed[best.key] = 1; state.alarm = null; box.hidden = true; pushAlarms();
    };
  }

  function ensureCal() {
    if (state.calendars.some(function (c) { return c && c.id; })) return Promise.resolve();
    var cal = { id: 'default', name: T('defaultCalendar'), color: PALETTE[0], hidden: false };
    state.calendars = [cal];
    return db('calendars').put(cal);
  }
  function ensureSettings() {
    if (state.settingsKnown) return Promise.resolve();
    return saveSettings();
  }
  function migrate() {
    var jobs = [], made = [];
    state.events.slice().forEach(function (row) {
      if (!isLegacy(row)) return;
      var allDay = !row.t;
      var partial = { uid: 'legacy-' + row.id + '@gifos.app', title: row.title, cal: defaultCal().id, allDay: allDay };
      if (allDay) { partial.start = row.d; partial.end = addDateStr(row.d, 1); }
      else {
        var t = String(row.t).length === 5 ? row.t + ':00' : String(row.t);
        partial.tzid = ''; partial.startLocal = row.d + 'T' + t; partial.endLocal = addClock(partial.startLocal, 60);
      }
      var ev = I.makeEvent(partial); ev.id = ev.uid;
      made.push(ev);
      jobs.push(putEvent(ev).then(function () { return delEvent(row.id); }));
    });
    return Promise.all(jobs);
  }
  function takeDraft() {
    bridge.takeDraft().then(function (d) {
      if (!d || !d.link) return;
      var f = blankForm();
      f.title = d.title || '';
      f.url = d.link;
      f.notes = T('joinLine', { link: d.link });
      f.meet = true;
      f.meetMode = d.mode === 'open' ? 'open' : 'hosted';
      f.tz = viewerZone();
      openEditor(null, f);
    }).catch(function () {});
  }
  function ready() {
    if (started || booting) return;
    if (!seen.events || !seen.calendars || !seen.invites || !seen.settings) return;
    started = true; booting = true;
    state.view = state.settings.view || 'month';
    ensureCal().then(ensureSettings).then(migrate).then(function () {
      booting = false;
      render(); pushAlarms(); checkAlarms();
      bridge.onInbox(ingest);
      takeDraft();
      setInterval(checkAlarms, 60000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) checkAlarms(); });
    }).catch(function (e) { booting = false; say(String(e && e.message || e)); });
  }

  function boot() {
    if (!I) { document.getElementById('view').textContent = T('missing'); return; }
    scheme();
    if (window.matchMedia) {
      try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', scheme); } catch (e) {}
    }
    db('events').subscribe(function (rows) {
      if (!started) { state.events = rows || []; seen.events = true; ready(); return; }
      if (booting) return;
      var gen = ++eventPaint;
      state.events = rows || [];
      setTimeout(function () {
        if (gen !== eventPaint) return;
        render(); pushAlarms();
      }, 40);
    });
    db('calendars').subscribe(function (rows) {
      if (!started) { state.calendars = rows || []; seen.calendars = true; ready(); return; }
      if (booting) return;
      state.calendars = rows || []; render();
    });
    db('invites').subscribe(function (rows) {
      if (!started) { state.invites = rows || []; seen.invites = true; ready(); return; }
      if (booting) return;
      state.invites = rows || []; badge();
    });
    db('calendar_settings').subscribe(function (rows) {
      if (started) return;
      var row = null;
      (rows || []).forEach(function (r) { if (r && r.id === 'settings') row = r; });
      if (row) {
        state.settingsKnown = true;
        if (row.view) state.settings.view = row.view;
        if (row.weekStart === 0 || row.weekStart === 1 || row.weekStart === 6) state.settings.weekStart = row.weekStart;
        if (typeof row.reminder === 'number') state.settings.reminder = row.reminder;
        if (row.meetMode === 'open' || row.meetMode === 'hosted') state.settings.meetMode = row.meetMode;
      }
      seen.settings = true; ready();
    });
  }

  document.getElementById('prev').onclick = function () { move(-1); };
  document.getElementById('next').onclick = function () { move(1); };
  document.getElementById('today').onclick = goToday;
  document.getElementById('add').onclick = function () { openEditor(null, blankForm(dateKey(state.focus))); };
  document.getElementById('cals').onclick = openCalendars;
  document.getElementById('bell').onclick = openInbox;
  document.getElementById('views').onclick = function (e) {
    var b = e.target.closest && e.target.closest('[data-view]'); if (!b) return; setView(b.getAttribute('data-view'));
  };
  document.getElementById('view').addEventListener('click', function (e) {
    var key = e.target.closest && e.target.closest('[data-key]');
    if (key) { var occ = state.shown[key.getAttribute('data-key')]; if (occ) openDetail(occ); return; }
    var day = e.target.closest && e.target.closest('[data-day]');
    if (day && !e.target.closest('[data-col]')) {
      var k = day.getAttribute('data-day');
      state.focus = parseDay(k);
      if (state.view === 'month') render();
      return;
    }
    var col = e.target.closest && e.target.closest('[data-col]');
    if (col && !e.target.closest('.ev')) {
      var rect = col.getBoundingClientRect();
      var hour = Math.max(0, Math.min(23, Math.floor((e.clientY - rect.top) / HOUR)));
      openEditor(null, blankForm(col.getAttribute('data-day'), hour));
    }
  });
  document.getElementById('file').addEventListener('change', function () {
    onFiles(document.getElementById('file').files);
    document.getElementById('file').value = '';
  });
  document.addEventListener('dragover', function (e) {
    if (!e.dataTransfer) return;
    var types = [].slice.call(e.dataTransfer.types || []);
    if (types.indexOf('Files') >= 0) { e.preventDefault(); document.body.classList.add('drop'); }
  });
  document.addEventListener('dragleave', function () { document.body.classList.remove('drop'); });
  document.addEventListener('drop', function (e) {
    document.body.classList.remove('drop');
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    var ics = [].filter.call(e.dataTransfer.files, function (f) { return /\.ics$/i.test(f.name) || /calendar/i.test(f.type || ''); });
    if (!ics.length) return;
    e.preventDefault(); onFiles(ics);
  });
  var touch = null;
  document.getElementById('view').addEventListener('touchstart', function (e) {
    if (!e.touches || !e.touches[0]) return;
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.getElementById('view').addEventListener('touchend', function (e) {
    if (!touch || document.querySelector('#sheets .modal-bg')) { touch = null; return; }
    var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
    var dx = t.clientX - touch.x, dy = t.clientY - touch.y; touch = null;
    if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    var sc = document.getElementById('week-scroll');
    if (sc && e.target && sc.contains(e.target)) {
      var max = sc.scrollWidth - sc.clientWidth;
      if (dx < 0 && sc.scrollLeft < max - 8) return;
      if (dx > 0 && sc.scrollLeft > 8) return;
    }
    move(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', function (e) {
    var typing = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === 'Escape' && document.querySelector('#sheets .modal-bg')) {
      var sheets = document.querySelectorAll('#sheets .modal-bg');
      var last = sheets[sheets.length - 1]; if (last) last.parentNode.removeChild(last);
      if (!document.querySelector('#sheets .modal-bg')) document.body.classList.remove('sheet-on');
      return;
    }
    if (typing || document.querySelector('#sheets .modal-bg')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { state.focus = addDays(state.focus, -1); render(); }
    else if (e.key === 'ArrowDown') { state.focus = addDays(state.focus, 1); render(); }
    else if (e.key === 't' || e.key === 'T') goToday();
    else if (e.key === 'm' || e.key === 'M') setView('month');
    else if (e.key === 'w' || e.key === 'W') setView('week');
    else if (e.key === 'd' || e.key === 'D') setView('day');
    else if (e.key === 'a' || e.key === 'A') setView('agenda');
    else if (e.key === 'n' || e.key === 'N') openEditor(null, blankForm(dateKey(state.focus)));
  });

  if (window.gifos && gifos.i18n && gifos.i18n.load) gifos.i18n.load().then(boot, boot);
  else boot();
  if (window.gifos && gifos.onLocaleChange) gifos.onLocaleChange(function () { applyI18n(); render(); });
})();
</script>
