name = "gifos-gifs"
main = "src/gifs.js"
compatibility_date = "2026-01-01"
# A wildcard is only allowed at the start of the host or the end of the
# path, so gifos.app/*.gif is rejected. Other subdomains belong to other
# workers. www.gifos.app only redirects to the apex.
workers_dev = false

[[routes]]
pattern = "gifos.app/apps/*"
zone_name = "gifos.app"

[[routes]]
pattern = "gifos.app/_goal.gif*"
zone_name = "gifos.app"

[[routes]]
pattern = "www.gifos.app/*"
zone_name = "gifos.app"

[[r2_buckets]]
binding = "GIFS"
bucket_name = "gifos-gifs"
